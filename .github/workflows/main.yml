name: Compile MoneroMiner to WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "miner-v2" ]
  pull_request:
    branches: [ "main", "master", "miner-v2" ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código-fonte do seu repositório (incluindo submódulos se houver)
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Instala as dependências de compilação do Linux (CMake e Make)
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.50'
        cache-key: 'dirijdix'

    - name: Verify Emscripten Installation
      run: |
        emcc -v
        em++ -v

    # Garante que nenhum objeto/cache WASM antigo seja reutilizado.
    - name: Clean all build caches
      run: |
        rm -rf RandomX/build-wasm
        rm -rf randomx/build-wasm
        rm -rf RandomX/build
        rm -rf randomx/build
        rm -rf build
        rm -rf bin

    # Confirma que o workflow está compilando exatamente o commit da miner-v2.
    - name: Verify source
      run: |
        echo "=== COMMIT ==="
        git rev-parse HEAD

        echo "=== BRANCH ==="
        git branch --show-current

        echo "=== wasm_jit.cpp ==="
        wc -l RandomX/src/wasm_jit.cpp

        echo "=== DEBUG SEARCH ==="
        if grep -nE 'std::cout|std::cerr|\[WASM-JIT\]|opcode_name|print_opcode_limits' RandomX/src/wasm_jit.cpp; then
          echo "ERRO: código antigo/debug encontrado"
          exit 1
        else
          echo "OK: código sem debug"
        fi

    - name: Configure RandomX
      run: |
        emcmake cmake -S RandomX -B RandomX/build-wasm \
          -DCMAKE_BUILD_TYPE=Release \
          -DRANDOMX_WASM_SIMD=ON \
          -DRANDOMX_WASM_PTHREADS=ON

    - name: Build RandomX with verbose output
      run: |
        cmake --build RandomX/build-wasm --parallel $(nproc) --verbose

    - name: Verify wasm_jit object and static library
      run: |
        echo "=== WASM JIT OBJECT ==="
        JIT_OBJ="RandomX/build-wasm/CMakeFiles/randomx.dir/src/wasm_jit.cpp.o"
        if [ ! -f "$JIT_OBJ" ]; then
          echo "ERRO: wasm_jit.cpp.o não foi gerado"
          find RandomX/build-wasm -name 'wasm_jit.cpp.o' -print
          exit 1
        fi
        ls -lh "$JIT_OBJ"
        sha256sum "$JIT_OBJ"

        echo "=== LIBRANDOMX ==="
        LIB="RandomX/build-wasm/librandomx.a"
        if [ ! -f "$LIB" ]; then
          echo "ERRO: librandomx.a não foi gerado"
          exit 1
        fi
        ls -lh "$LIB"
        sha256sum "$LIB"

        echo "=== CHECK OBJECT INSIDE LIBRARY ==="
        if ar t "$LIB" | grep -Fx 'wasm_jit.cpp.o'; then
          echo "OK: wasm_jit.cpp.o está dentro do librandomx.a"
        else
          echo "ERRO: wasm_jit.cpp.o NÃO está dentro do librandomx.a"
          ar t "$LIB"
          exit 1
        fi

        echo "=== WASM JIT SYMBOLS ==="
        llvm-nm "$JIT_OBJ" | head -100 || true

    - name: Compile Project via Makefile
      run: |
        make distclean
        make -j$(nproc)

    - name: Verify generated WASM
      run: |
        echo "=== GENERATED WASM ==="
        sha256sum bin/miner.wasm
        ls -lh bin/miner.wasm

    - name: Upload WebAssembly Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: monerominer-wasm-dist
        path: |
          bin/*
        retention-days: 7
