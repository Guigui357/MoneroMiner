name: Compile MoneroMiner to WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "miner-v2" ]
  pull_request:
    branches: [ "main", "master", "miner-v2" ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código-fonte do seu repositório (incluindo submódulos se houver)
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Instala as dependências de compilação do Linux (CMake e Make)
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.50'
        cache-key: 'dirijdix'

    - name: Verify Emscripten Installation
      run: |
        emcc -v
        em++ -v

    # Garante que nenhum objeto/cache WASM antigo seja reutilizado.
    - name: Clean all build caches
      run: |
        rm -rf RandomX/build-wasm
        rm -rf randomx/build-wasm
        rm -rf RandomX/build
        rm -rf randomx/build
        rm -rf build
        rm -rf bin

    # Confirma que o workflow está compilando exatamente o commit da miner-v2.
    - name: Verify source
      run: |
        echo "=== COMMIT ==="
        git rev-parse HEAD

        echo "=== BRANCH ==="
        git branch --show-current

        echo "=== wasm_jit.cpp ==="
        wc -l RandomX/src/wasm_jit.cpp

        echo "=== DEBUG SEARCH ==="
        if grep -nE 'std::cout|std::cerr|\[WASM-JIT\]|opcode_name|print_opcode_limits' RandomX/src/wasm_jit.cpp; then
          echo "ERRO: código antigo/debug encontrado"
          exit 1
        else
          echo "OK: código sem debug"
        fi

    - name: Compile Project via Makefile
      run: |
        make distclean
        make -j$(nproc)

    - name: Verify generated WASM
      run: |
        echo "=== GENERATED JS ==="
        sha256sum bin/miner.js
        ls -lh bin/miner.js

    - name: Upload WebAssembly Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: monerominer-wasm-dist
        path: |
          bin/*
        retention-days: 7
