name: Apply WASM JIT store fix

on:
  push:
    branches: [miner-v2]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message != 'fix: correct WASM JIT store operand order'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: miner-v2
          fetch-depth: 0

      - name: Patch generated WASM stores
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RandomX/src/wasm_jit.cpp')
          s = p.read_text()

          old = '''static void store_reg(std::vector<uint8_t>& c,
                      uint32_t r) {
    local_get(c, 0);

    i32_const(
        c,
        static_cast<int32_t>(r * 8)
    );

    c.push_back(0x6a); // i32.add

    i64_store(c);
}'''
          new = '''static void store_reg(std::vector<uint8_t>& c,
                      uint32_t r) {
    // Final writeback occurs after the dispatcher. Use pc (local 62)
    // as a temporary to reorder the value/address operands.
    local_set(c, 62);
    local_get(c, 0);

    i32_const(
        c,
        static_cast<int32_t>(r * 8)
    );

    c.push_back(0x6a); // i32.add
    local_get(c, 62);
    i64_store(c);
}'''
          if old not in s:
              raise SystemExit('store_reg definition not found')
          s = s.replace(old, new, 1)

          old = '''static void store_fp_lane(std::vector<uint8_t>& c,
                          uint32_t ptr_local,
                          uint32_t index,
                          uint32_t lane) {
    local_get(c, ptr_local);

    i32_const(
        c,
        static_cast<int32_t>(
            index * 16 + lane * 8
        )
    );

    c.push_back(0x6a); // i32.add

    i64_store(c);
}'''
          new = '''static void store_fp_lane(std::vector<uint8_t>& c,
                          uint32_t ptr_local,
                          uint32_t index,
                          uint32_t lane) {
    // Final writeback occurs after the dispatcher. Use pc (local 62)
    // as a temporary to reorder the value/address operands.
    local_set(c, 62);
    local_get(c, ptr_local);

    i32_const(
        c,
        static_cast<int32_t>(
            index * 16 + lane * 8
        )
    );

    c.push_back(0x6a); // i32.add
    local_get(c, 62);
    i64_store(c);
}'''
          if old not in s:
              raise SystemExit('store_fp_lane definition not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- RandomX/src/wasm_jit.cpp

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RandomX/src/wasm_jit.cpp
          git rm .github/workflows/wasm-jit-store-fix.yml
          git commit -m 'fix: correct WASM JIT store operand order'
          git push origin HEAD:miner-v2
